<!DOCTYPE html>
<html lang="id" data-theme="medieval-midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="FocusPulse — simple fantasy Pomodoro, tasks, ambient sounds, and daily streaks.">
  <title>FocusPulse — Fantasy Focus Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./src/css/main.css">
</head>
<body>
  <div class="ambient-orb orb-one" aria-hidden="true"></div>
  <div class="ambient-orb orb-two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="FocusPulse home">
      <span class="brand-mark"><i data-lucide="sparkles"></i></span>
      <span>Focus<span>Pulse</span></span>
    </a>

    <div class="header-actions">
      <div class="streak-pill" title="Daily activity streak">
        <i data-lucide="flame"></i>
        <strong id="streak-count">0</strong>
        <span data-i18n="dayStreak">day streak</span>
      </div>

      <label class="compact-control">
        <span class="sr-only" data-i18n="language">Language</span>
        <select id="language-select" onchange="setLanguage(this.value)" aria-label="Language">
          <option value="id">ID</option>
          <option value="en">EN</option>
        </select>
      </label>

      <label class="compact-control theme-control">
        <i data-lucide="palette"></i>
        <select id="theme-select" onchange="setTheme(this.value)" aria-label="Theme"></select>
      </label>
    </div>
  </header>

  <main class="dashboard">
    <section class="hero-card panel">
      <div class="panel-eyebrow">
        <span><i data-lucide="timer"></i> <span data-i18n="focusRitual">Focus ritual</span></span>
        <span id="session-counter">0 sessions</span>
      </div>

      <div class="mode-tabs" role="tablist" aria-label="Timer mode">
        <button id="mode-focus" class="mode-tab active" onclick="setTimerMode('focus')" data-i18n="focus">Focus</button>
        <button id="mode-short" class="mode-tab" onclick="setTimerMode('short')" data-i18n="shortBreak">Short Break</button>
        <button id="mode-long" class="mode-tab" onclick="setTimerMode('long')" data-i18n="longBreak">Long Break</button>
      </div>

      <div class="timer-wrap">
        <svg class="timer-ring" viewBox="0 0 260 260" aria-hidden="true">
          <circle class="ring-track" cx="130" cy="130" r="116"></circle>
          <circle id="timer-progress-ring" class="ring-progress" cx="130" cy="130" r="116"></circle>
        </svg>
        <div class="timer-copy">
          <div id="timer-display" class="timer-display">25:00</div>
          <div id="timer-status" class="timer-status" data-i18n="ready">Ready</div>
        </div>
      </div>

      <div class="timer-actions">
        <button id="timer-toggle" class="button primary large" onclick="toggleTimer()">
          <i id="timer-toggle-icon" data-lucide="play"></i>
          <span id="timer-toggle-label" data-i18n="start">Start</span>
        </button>
        <button class="icon-button" onclick="resetTimer()" data-i18n-title="reset" title="Reset" aria-label="Reset">
          <i data-lucide="rotate-ccw"></i>
        </button>
        <button class="icon-button" onclick="skipTimer()" data-i18n-title="skip" title="Skip" aria-label="Skip">
          <i data-lucide="skip-forward"></i>
        </button>
      </div>

      <div id="active-task-bar" class="active-task-bar">
        <i data-lucide="swords"></i>
        <span data-i18n="currentQuest">Current quest:</span>
        <strong id="active-task-name" data-i18n="noneSelected">None selected</strong>
      </div>

      <details class="settings-drawer">
        <summary><i data-lucide="sliders-horizontal"></i> <span data-i18n="pomodoroOptions">Pomodoro options</span></summary>
        <div class="settings-content">
          <label>
            <span data-i18n="preset">Preset</span>
            <select id="preset-select" onchange="applyPreset(this.value)">
              <option value="quick">Quick Sprint — 15 / 3 / 8</option>
              <option value="classic" selected>Classic — 25 / 5 / 15</option>
              <option value="deep">Deep Work — 40 / 8 / 20</option>
              <option value="flow">Flow State — 50 / 10 / 25</option>
              <option value="epic">Epic Quest — 90 / 20 / 30</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <div class="duration-grid">
            <label><span data-i18n="focus">Focus</span><input id="duration-focus" type="number" min="1" max="180" value="25"></label>
            <label><span data-i18n="shortBreak">Short</span><input id="duration-short" type="number" min="1" max="60" value="5"></label>
            <label><span data-i18n="longBreak">Long</span><input id="duration-long" type="number" min="1" max="90" value="15"></label>
          </div>
          <button class="button secondary" onclick="saveCustomDurations()" data-i18n="applyDuration">Apply durations</button>
        </div>
      </details>
    </section>

    <aside class="side-stack">
      <section class="panel compact-panel">
        <div class="section-heading">
          <div>
            <span class="section-kicker" data-i18n="soundscape">Soundscape</span>
            <h2 data-i18n="ambientWorld">Ambient world</h2>
          </div>
          <button id="ambient-toggle" class="icon-button" onclick="toggleAmbient()" aria-label="Toggle ambient">
            <i id="ambient-icon" data-lucide="volume-x"></i>
          </button>
        </div>

        <label class="field">
          <span data-i18n="chooseAmbient">Choose ambient</span>
          <select id="ambient-select" onchange="setAmbientType(this.value)">
            <option value="rain">🌧️ Castle Rain</option>
            <option value="forest">🌲 Enchanted Forest</option>
            <option value="fireplace">🔥 Tavern Fireplace</option>
            <option value="ocean">🌊 Mystic Ocean</option>
            <option value="wind">🍃 Mountain Wind</option>
            <option value="night">🌙 Moonlit Night</option>
            <option value="library">📚 Ancient Library</option>
            <option value="white">◻️ White Noise</option>
            <option value="pink">🌸 Pink Noise</option>
            <option value="brown">🟤 Brown Noise</option>
          </select>
        </label>

        <label class="volume-field">
          <span><span data-i18n="volume">Volume</span> <strong id="volume-value">35%</strong></span>
          <input id="volume-slider" type="range" min="0" max="100" value="35" oninput="setAmbientVolume(this.value)">
        </label>
      </section>

      <section class="panel compact-panel">
        <div class="section-heading">
          <div>
            <span class="section-kicker" data-i18n="dailyProgress">Daily progress</span>
            <h2 data-i18n="microHabits">Micro habits</h2>
          </div>
          <span id="habit-progress" class="progress-chip">0/3</span>
        </div>
        <div id="habits-list" class="habit-list"></div>
        <form class="inline-form" onsubmit="addHabit(event)">
          <input id="habit-input" maxlength="60" data-i18n-placeholder="newHabitPlaceholder" placeholder="Add a tiny habit..." required>
          <button class="icon-button" type="submit" aria-label="Add habit"><i data-lucide="plus"></i></button>
        </form>
      </section>
    </aside>

    <section class="panel tasks-panel">
      <div class="section-heading tasks-heading">
        <div>
          <span class="section-kicker" data-i18n="questBoard">Quest board</span>
          <h2 data-i18n="todayTasks">Today's tasks</h2>
        </div>
        <button class="button surprise" onclick="addRandomTask()">
          <i data-lucide="dices"></i>
          <span data-i18n="surpriseMe">Surprise me</span>
        </button>
      </div>

      <form class="task-form" onsubmit="addTask(event)">
        <input id="task-input" maxlength="100" data-i18n-placeholder="taskPlaceholder" placeholder="What do you want to finish?" required>
        <select id="task-tag" aria-label="Task category">
          <option value="Study">📖 Study</option>
          <option value="Code">💻 Code</option>
          <option value="Life">✨ Life</option>
          <option value="Creative">🎨 Creative</option>
          <option value="Random">🎲 Random</option>
        </select>
        <button class="button primary" type="submit"><i data-lucide="plus"></i><span data-i18n="addQuest">Add quest</span></button>
      </form>

      <div id="task-list" class="task-list"></div>
      <div id="empty-tasks" class="empty-state">
        <i data-lucide="scroll-text"></i>
        <p data-i18n="emptyTasks">Your quest board is empty.</p>
        <button class="text-button" onclick="addRandomTask()" data-i18n="tryRandom">Try a random task</button>
      </div>
    </section>
  </main>

  <footer>
    <span>FocusPulse</span> <span aria-hidden="true">✦</span>
    <span data-i18n="footerText">Small actions, legendary consistency.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./src/js/i18n.js"></script>
  <script src="./src/js/theme.js"></script>
  <script src="./src/js/app.js"></script>
</body>
</html>
